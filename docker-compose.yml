services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      PGHOST: pgbouncer
      PGPORT: 5432
      PGUSER: app_user
      PGPASSWORD: apppass
      PGDATABASE: appdb
      PG_POOL_MAX: 10
      OPENAPI_SPEC: openapi/openapi.yaml
      REDIS_URL: redis://redis-cache:6379
      REDIS_QUEUE_URL: redis://redis-queue:6379
    volumes:
      - ./secrets:/app/secrets:ro
    ports:
      - "3000:3000"
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin-bootstrap-only
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
      - ./db/grants.sql:/docker-entrypoint-initdb.d/03-grants.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d appdb']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    ports:
      - "6432:5432"
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', "PGPASSWORD=apppass psql -h 127.0.0.1 -p 5432 -U app_user -d appdb -c 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  rabbit:
    image: rabbitmq:4.2-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: app
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ['CMD-SHELL', 'rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity']
      interval: 5s
      start_interval: 1s
      start_period: 40s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  pactbroker-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pactbroker
      POSTGRES_PASSWORD: pactbroker
      POSTGRES_DB: pactbroker
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pactbroker -d pactbroker']
      interval: 2s
      timeout: 2s
      retries: 15

  pactbroker:
    image: pactfoundation/pact-broker:2.142.0-pactbroker2.120.0
    ports:
      - "9292:9292"
    environment:
      PACT_BROKER_DATABASE_URL: postgres://pactbroker:pactbroker@pactbroker-db/pactbroker
      PACT_BROKER_ALLOW_PUBLIC_READ: "true"
    depends_on:
      pactbroker-db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:9292/diagnostic/status/heartbeat']
      interval: 3s
      timeout: 3s
      retries: 30

  restore:
    image: postgres:17
    profiles: ["drill"]
    ports:
      - "6433:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin-bootstrap-only
      POSTGRES_DB: appdb
    volumes:
      - pgdata-restore:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d appdb']
      interval: 2s
      timeout: 3s
      retries: 30

  redis-cache:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6391:6379"
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 3s
    restart: unless-stopped

  redis-queue:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6392:6379"
    volumes:
      - redis-queue-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 3s
    restart: unless-stopped

volumes:
  pgdata:
  pgdata-restore:
  redis-queue-data:
