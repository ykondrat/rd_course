services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      PGHOST: pgbouncer
      PGPORT: 5432
      PGUSER: app_user
      PGPASSWORD: apppass
      PGDATABASE: appdb
      PG_POOL_MAX: 10
      OPENAPI_SPEC: openapi/openapi.yaml
    volumes:
      - ./secrets:/app/secrets:ro
    ports:
      - "3000:3000"
    depends_on:
      pgbouncer:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin-bootstrap-only
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
      - ./db/grants.sql:/docker-entrypoint-initdb.d/03-grants.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d appdb']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    ports:
      - "6432:5432"
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', "PGPASSWORD=apppass psql -h 127.0.0.1 -p 5432 -U app_user -d appdb -c 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  restore:
    image: postgres:17
    profiles: ["drill"]
    ports:
      - "6433:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin-bootstrap-only
      POSTGRES_DB: appdb
    volumes:
      - pgdata-restore:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d appdb']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  pgdata-restore:
