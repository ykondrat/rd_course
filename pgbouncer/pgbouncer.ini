[databases]
appdb = host=postgres port=5432 dbname=appdb

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction

default_pool_size = 5

max_client_conn = 200

max_prepared_statements = 0

admin_users = admin
stats_users = admin

ignore_startup_parameters = extra_float_digits